name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT_NAME: Tool.exe        # 产物文件名（建议 ASCII，避免 URL 编码麻烦）
  ENTRY: windows/app.exe    # Windows 端解压后要运行的程序
  STUB_ARCH: 386            # 386 = 32/64 位 Windows 通用；amd64 体积略小但只支持 64 位

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'   # 最后一个支持 Windows 7/8 的版本；只发 Win10+ 可改最新
          cache: false

      # 若各平台产物来自别的 workflow，取消下面注释自动拉取
      # - name: 拉取各平台产物
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: platform-builds
      #     path: payloads

      - name: 查看负载目录
        run: find payloads -type f -not -name '.gitkeep' -not -name 'README.md' | sort

      - name: 构建单文件
        run: bash scripts/build.sh

      - name: 校验产物
        run: python3 scripts/verify.py "$OUT_NAME"

      - name: 生成校验和
        run: sha256sum "$OUT_NAME" | tee "$OUT_NAME.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: single-file-package
          path: |
            ${{ env.OUT_NAME }}
            ${{ env.OUT_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OUT_NAME }}
            ${{ env.OUT_NAME }}.sha256
          generate_release_notes: true
